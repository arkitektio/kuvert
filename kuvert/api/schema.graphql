type Mutation {
  """
  Link a mailbox with a username and (app) password; the login is tested first.
  """
  createMailAccount(input: CreateMailAccountInput!): MailAccount! @auth(required_scopes: null, required_roles: null, required_org_roles: null)

  """
  Change a mailbox (owner only); new servers or credentials are tested first.
  """
  updateMailAccount(input: UpdateMailAccountInput!): MailAccount! @auth(required_scopes: null, required_roles: null, required_org_roles: null)

  """Log in to a mailbox's servers now."""
  testMailAccount(id: ID!): MailAccount! @auth(required_scopes: null, required_roles: null, required_org_roles: null)

  """Unlink a mailbox (owner only). Mail on the server is untouched."""
  deleteMailAccount(id: ID!): ID! @auth(required_scopes: null, required_roles: null, required_org_roles: null)

  """Set who sees a mailbox (owner only)."""
  shareMailAccount(input: ShareMailAccountInput!): MailAccount! @auth(required_scopes: null, required_roles: null, required_org_roles: null)

  """Turn syncing a folder on or off."""
  updateMailFolder(input: UpdateMailFolderInput!): MailFolder! @auth(required_scopes: null, required_roles: null, required_org_roles: null)

  """Sync a mailbox now."""

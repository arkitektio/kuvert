  NOT_CONFIGURED
  AUTH_FAILED
  CONSENT_EXPIRED
  CONNECTION_FAILED
  TLS_FAILED
  TLS_REQUIRED
  HOST_NOT_ALLOWED
  SYNC_IN_PROGRESS
  RATE_LIMITED
  SERVER_ERROR
  SEND_REJECTED
  UNSUPPORTED_BY_PROTOCOL
  MAILBOX_INACTIVE
  INVALID_STATE
  CODE_EXPIRED
  PROVIDER_ERROR
  UNSUPPORTED_BY_POLICY
  KEYWORDS_NOT_PERMITTED
  MESSAGE_GONE
  UNSAFE_EXPUNGE
}


services:
  redis:
    image: redis:latest
  db:
    # daten:next carries pgvector, which kuvert's semantic search columns need.
    image: jhnnsrs/daten:next
    restart: always
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_MULTIPLE_DATABASES: kuvert
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  # Brings the database to the image's release, once, before the server is started: a
  # service's own start only serves.
  kuvert-migrate:
    depends_on:
    - db
    image: jhnnsrs/kuvert:${KUVERT_SERVICE_TAG:-latest}
    command: arkitekt-service run migrate
    volumes:
    - ./configs/kuvert.yaml:/workspace/config.yaml
    # A Fernet key generated per run by tests/conftest.py (gitignored): never commit one.
    - ./secrets:/secrets:ro
  kuvert:
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      mail:
        condition: service_started
      kuvert-migrate:
        condition: service_completed_successfully
    image: jhnnsrs/kuvert:${KUVERT_SERVICE_TAG:-latest}
    command: arkitekt-service debug
    stop_grace_period: 1s
    ports:
    - "${KUVERT_HOST_PORT:-6890}:80"
    volumes:
    - ./configs/kuvert.yaml:/workspace/config.yaml
    # A Fernet key generated per run by tests/conftest.py (gitignored): never commit one.
    - ./secrets:/secrets:ro
  mail:
    # A real mail server (SMTP, IMAP, POP3; plain and TLS with a self-signed
    # certificate), and a REST API (8080) the tests create users through.
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
    ports:
    - "${MAIL_API_HOST_PORT:-6891}:8080"
    - "${MAIL_SMTP_HOST_PORT:-6892}:3025"

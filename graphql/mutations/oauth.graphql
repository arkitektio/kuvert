mutation StartOAuthLink(
  $provider: ID
  $protocol: Protocol
  $redirectUrl: String
  $name: String
  $account: ID
  $loginHint: String
) {
  startOAuthLink(input: { provider: $provider, protocol: $protocol, redirectUrl: $redirectUrl, name: $name, account: $account, loginHint: $loginHint }) {
    ...AuthSession
  }
}

mutation CompleteAuth($input: CompleteAuthInput!) {
  completeAuth(input: $input) {
    ...AuthSession
  }
}

mutation ResumeAuth($state: String!) {
  resumeAuth(state: $state) {
    ...AuthSession
  }
}

mutation CancelAuth($state: String!) {
  cancelAuth(state: $state) {
    ...AuthSession
  }
}

fragment MailAccount on MailAccount {
  id
  name
  emailAddress
  displayName
  provider
  status
  visibility
  protocol
  authMethod
  capabilities
  lastSyncedAt
  lastError
  lastErrorCode
  backfillDone
  createdAt
  isOwner
  canSend
  syncing
  unreadCount
  pendingChanges
  failedChanges
  mailProvider {
    ...MailProviderRef
  }
}

fragment DetailMailAccount on MailAccount {
  ...MailAccount
  incomingHost
  incomingPort
  incomingSecurity
  smtpHost
  smtpPort
  smtpSecurity
  username
  saveSentCopy
  popLeaveOnServer
  pushSeen
  pushFlagged
  pushKeywords
  pushMoves
  pushDeletes
  serverSideFolders
  sharedWith {
    id
    sub
    preferredUsername
  }
  folders {
    ...MailFolder
  }
  pendingAuth {
    ...AuthSession
  }
}

fragment MailPreset on MailPreset {
  key
  name
  domains
  provider
  imap {
    ...ServerSettings
  }
  pop3 {
    ...ServerSettings
  }
  smtp {
    ...ServerSettings
  }
  saveSentCopy
  oauth
  oauthConfigured
  note
}

fragment ServerSettings on ServerSettings {
  host
  port
  security
}

fragment AuthSession on AuthSession {
  state
  status
  finish
  openUrl
  expiresAt
  redirectUrl
  interval
  userCode
  step
  errorCode
  errorMessage
  result {
    identifier
    id
    label
  }
}
